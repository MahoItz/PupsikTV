name: Quality Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint, Stylelint and Prettier checks
        run: npm run lint

      - name: Build Pages and API
        run: |
          npm run build:pages
          npm run build:edge

      - name: Check Pages migration
        run: npm run test:migration

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function
        run: |
          deno check supabase/functions/pupsik-api/index.ts
          deno test --allow-env --allow-net --allow-read supabase/functions/pupsik-api/router_test.ts
