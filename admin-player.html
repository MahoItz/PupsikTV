<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pupsik TV — Админ плеер</title>
  <link rel="icon" href="images/Pupsik_TV_Icon.webp">
  <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/navigation.css?v=20261007-admin-nav-2">
  <link rel="stylesheet" href="style/loaders.css">
  <link rel="stylesheet" href="style/buttons.css">
  <link rel="stylesheet" href="style/controls.css">
  <link rel="stylesheet" href="style/forms.css">
  <link rel="stylesheet" href="style/autocomplete.css">
  <link rel="stylesheet" href="style/modals.css">
  <link rel="stylesheet" href="style/admin-player.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script/site-config.js"></script>
</head>

<body>
    <nav class="top-left-actions top-left-actions--bar top-left-actions--page" aria-label="Основная навигация">
        <a href="./" class="top-left-actions__brand" aria-label="PupsikTV — главная страница">
            <img src="images/Pupsik_TV_Icon.webp" alt="">
            <span>PupsikTV</span>
        </a>
        <div class="top-left-actions__menu">
            <a href="admin-player.html" aria-current="page" class="admin-player-link" data-admin-navigation hidden style="display: none;">
                <span class="top-left-actions__label">Плеер</span>
            </a>
            <a href="trailers.html" class="admin-player-link">
                <span class="top-left-actions__label">Трейлеры</span>
            </a>
            <a href="stats.html" class="channel-stats-link">
                <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>
                <span class="top-left-actions__label">Статистика</span>
            </a>
        </div>
    </nav>
  <div class="admin-player-page">

    <main id="adminPlayerApp" class="admin-player-app" hidden>
      <div class="admin-player-main">
        <section class="admin-player-search">
          <label for="adminPlayerSearchInput">Название фильма</label>
          <div class="admin-player-search__input-wrap input-with-btn">
            <input id="adminPlayerSearchInput" class="search-input" type="text" placeholder="Введите название фильма" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="adminPlayerResults">
            <button id="adminPlayerSearchButton" type="button" class="search-btn" aria-label="Поиск фильма">
              <i class="fas fa-search" aria-hidden="true"></i>
            </button>
          </div>
          <div id="adminPlayerResultsContainer" class="admin-player-search__results" style="display:none;">
            <div id="adminPlayerResults" class="autocomplete-list" role="listbox" aria-label="Найденные фильмы"></div>
          </div>
        </section>

        <section class="order-player-modal admin-player-embed">
          <div class="order-player-header">
            <div class="order-player-heading">
              <h2 id="adminPlayerTitle" class="order-player-title">Выберите фильм для просмотра</h2>
            </div>
            <div class="order-player-actions">
              <div class="order-player-controls">
                <label class="order-player-control">
                  <span class="order-player-control-label">Источник</span>
                  <select id="adminPlayerSourceSelect" aria-label="Источник"></select>
                </label>
                <label class="order-player-control">
                  <span class="order-player-control-label">Перевод</span>
                  <select id="adminPlayerTranslationSelect" aria-label="Перевод"></select>
                </label>
              </div>
              <a id="adminPlayerOpenExternal" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Открыть во вкладке</a>
            </div>
          </div>
          <div class="order-player-frame-wrap">
            <div id="adminPlayerLoader" class="order-player-loader" aria-hidden="true">
              <div class="order-player-spinner"></div>
              <div class="order-player-loader-text">Загружаю плеер…</div>
            </div>
            <iframe id="adminPlayerFrame" class="order-player-frame" title="Плеер фильма" loading="lazy"
              allow="autoplay; fullscreen; picture-in-picture"></iframe>
          </div>
        </section>
      </div>

      <section class="admin-player-history">
        <div class="admin-player-history__header">
          <h2 class="admin-player-history__title">История просмотра</h2>
          <div id="adminPlayerHistoryLoader" class="section-loader section-loader--compact admin-player-history__loader" role="status" aria-live="polite" aria-hidden="true">
            <div class="section-loader__spinner" aria-hidden="true">
              <span class="section-loader__ring"></span>
              <span class="section-loader__ring section-loader__ring--delay"></span>
            </div>
            <p class="section-loader__text">Загружаем историю просмотра...</p>
          </div>
        </div>
        <div id="adminPlayerHistoryList" class="admin-player-history__list"></div>
        <p class="admin-player-history__empty" hidden>Пока ничего не смотрели</p>
      </section>
    </main>

  </div>
  <footer class="site-footer">
    <p class="site-footer__text">Дата создания сайта: <span class="site-footer__date">6 июля 2025</span></p>
  </footer>

  <script src="script/admin-session.js" defer></script>
    <script src="script/media-search.js" defer></script>
  <script src="script/admin-player.js" defer></script>
  <script src="script/admin-navigation.js?v=20261007-admin-nav-2" defer></script>
</body>

</html>
